plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fake.settings'
    compileSdk 36

    defaultConfig {
        applicationId "com.fake.settings"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external deps needed
}
